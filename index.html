<style>
/* ===== TOKENS ===== */
:root{--bg:#f6efe2;--card:#fffaf0;--ink:#2a1a14;--mut:#6f5d52;--wine:#6b1d2a;--terra:#b5532f;--gold:#b8923a;--line:#e0d3bd;--nav:#f6efe2ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1513;--card:#2a1e1b;--ink:#f1e6d4;--mut:#b9a999;--wine:#d98a94;--terra:#e0845a;--gold:#d6b165;--line:#44332d;--nav:#1d1513ee}}
:root[data-theme="dark"]{--bg:#1d1513;--card:#2a1e1b;--ink:#f1e6d4;--mut:#b9a999;--wine:#d98a94;--terra:#e0845a;--gold:#d6b165;--line:#44332d;--nav:#1d1513ee}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;line-height:1.1}
a{color:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section{padding:56px 18px;max-width:1100px;margin:auto}
h2{font-size:clamp(32px,6vw,52px);margin-bottom:8px}.eyebrow{letter-spacing:.2em;font-size:12px;font-weight:800;color:var(--terra);text-transform:uppercase}
.lead{color:var(--mut);max-width:60ch}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--gold);width:0;z-index:60}
/* ===== NAV ===== */
nav{position:sticky;top:0;z-index:50;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center}
nav .links{display:flex;overflow-x:auto;flex:1;scrollbar-width:none}nav .links::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;padding:16px 13px;font-size:12px;font-weight:800;letter-spacing:.1em;text-decoration:none;color:var(--mut)}
nav a.on{color:var(--wine);box-shadow:inset 0 -3px var(--terra)}
#theme{border:0;background:none;color:var(--ink);font-size:20px;padding:10px 14px;cursor:pointer}
